services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: filinglens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filinglens}
      POSTGRES_DB: filinglens
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filinglens -d filinglens"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
