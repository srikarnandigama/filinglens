# M5 test run (D088, D089, D105): B1 and B2 (Sonnet 5.5, Batch API) on the frozen 100-question
# test sample. Batch work is reserved up front, per question: B1 $0.075 (estimate $0.0625, cut 4
# max_uses 3) and B2 $0.021 (estimate $0.0174) -> $9.60 reserved. Expected $8.0 (unmeasured).
name = "m5-test-sample"
split = "test"
sample = "sample_100"
seed = 20261109
spend_cap_usd = "9.75"

[[systems]]
id = "b1-sonnet"
kind = "b1"
model_env = "BASELINE_MODELS"
model_index = 0
batch = true
max_uses = 3              # cut 4
reserve_usd = "0.075"

[[systems]]
id = "b2-sonnet"
kind = "b2"
model_env = "BASELINE_MODELS"
model_index = 0
batch = true
reserve_usd = "0.021"
