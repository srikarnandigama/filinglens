# M5 test run (D105, Option C): system and B0 Sonnet on the frozen 180-question test subset.
# Expected $28.8 (system $27.5, bootstrap high $28.7; B0 Sonnet $1.3) plus up to $2.00 reserved
# for 4 in-flight system runs. Test-run caps sum to $60 (D090, D105).
name = "m5-test-subset"
split = "test"
sample = "subset_180"
seed = 20261109
concurrency = 4
spend_cap_usd = "32.00"

[[systems]]
id = "system"
kind = "system"
max_cost_usd = "0.50"

[[systems]]
id = "b0-sonnet"
kind = "b0"
model_env = "BASELINE_MODELS"
model_index = 0           # claude-sonnet-5-5
