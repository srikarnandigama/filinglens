[project]
name = "filinglens"
version = "0.1.0"
description = "Source-grounded SEC financial research and evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "selectolax>=1.0.1",
  "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "respx>=0.22,<0.23", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires migrated local PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
